name: CI

on:
  pull_request:

permissions:
  contents: read

# a new push to the same PR cancels the run still going on the old commit
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # a failing test shouldn't hide a type error, or the other way round
      fail-fast: false
      matrix:
        script: [test, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # "test" is `bun test`, "typecheck" is `tsc --noEmit -p .` (package.json)
      - run: bun run ${{ matrix.script }}
